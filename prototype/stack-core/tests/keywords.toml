# H3 keyword coverage: one row per keyword node in surql/70_hypertalk_keywords.surql.
# class: clean | partial | renamed | missing | na. `ours` must run without error; `test` names a test in path.rs.

[[kw]]
id = "cmd_add"
cls = "clean"
ours = "put 5 into n; add 3 to n; subtract 1 from n; multiply n by 2; divide n by 7; add 1 to field \"search\";"

[[kw]]
id = "cmd_answer"
cls = "partial"
ours = "answer \"hi\"; answer \"Save?\" with \"Yes\" or \"No\";"
note = "the clicked button arrives as an answered message, not in it"

